<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lab 8 – jQuery Dice Roll</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* --- Layout --- */
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f6f7fb;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: min(520px, 92vw);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p  { margin: 0 0 16px; color: #555; }

    /* --- Dice Face --- */
    .dice {
      --size: 160px;
      width: var(--size);
      height: var(--size);
      margin: 16px auto 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      background: #fff;
      border-radius: 24px;
      border: 3px solid #222;
      position: relative;
    }
    .pip {
      width: 22px;
      height: 22px;
      margin: auto;
      background: #222;
      border-radius: 50%;
      opacity: 0; /* hidden by default; we show the ones we need */
      transition: opacity 120ms ease;
    }

    /* handy positions in the 3x3 */
    /* we’ll drop a .show-* class on .dice to control which pips are visible */
    .pip.pos-1 { grid-area: 1 / 1; } /* top-left */
    .pip.pos-2 { grid-area: 1 / 2; } /* top-center */
    .pip.pos-3 { grid-area: 1 / 3; } /* top-right */
    .pip.pos-4 { grid-area: 2 / 1; } /* mid-left */
    .pip.pos-5 { grid-area: 2 / 2; } /* center */
    .pip.pos-6 { grid-area: 2 / 3; } /* mid-right */
    .pip.pos-7 { grid-area: 3 / 1; } /* bottom-left */
    .pip.pos-8 { grid-area: 3 / 2; } /* bottom-center */
    .pip.pos-9 { grid-area: 3 / 3; } /* bottom-right */

    /* Which pips to show for each value */
    .show-1 .pos-5,
    .show-2 .pos-1, .show-2 .pos-9,
    .show-3 .pos-1, .show-3 .pos-5, .show-3 .pos-9,
    .show-4 .pos-1, .show-4 .pos-3, .show-4 .pos-7, .show-4 .pos-9,
    .show-5 .pos-1, .show-5 .pos-3, .show-5 .pos-5, .show-5 .pos-7, .show-5 .pos-9,
    .show-6 .pos-1, .show-6 .pos-3, .show-6 .pos-4, .show-6 .pos-6, .show-6 .pos-7, .show-6 .pos-9
    { opacity: 1; }

    /* Rolling animation (simple shake) */
    @keyframes shake {
      0%   { transform: rotate(0deg)   translate(0,0); }
      25%  { transform: rotate(6deg)   translate(3px,-2px); }
      50%  { transform: rotate(-5deg)  translate(-2px,3px); }
      75%  { transform: rotate(4deg)   translate(2px,-3px); }
      100% { transform: rotate(0deg)   translate(0,0); }
    }
    .rolling {
      animation: shake 700ms ease-in-out;
    }

    /* Button */
    #roll {
      padding: 10px 16px;
      font-size: 16px;
      border: 0;
      border-radius: 12px;
      background: #1f7aec;
      color: white;
      cursor: pointer;
    }
    #roll:active { transform: translateY(1px); }
    .note { color: #777; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dice Roller (jQuery)</h1>
    <p>Click the button to roll. When the animation ends, the face updates to a random 1–6.</p>

    <!-- The dice starts as "6" to satisfy: 'The dice should initially display 6 dots.' -->
    <div id="dice" class="dice show-6">
      <!-- 9 pip positions; we toggle visibility via parent .show-N -->
      <div class="pip pos-1"></div>
      <div class="pip pos-2"></div>
      <div class="pip pos-3"></div>
      <div class="pip pos-4"></div>
      <div class="pip pos-5"></div>
      <div class="pip pos-6"></div>
      <div class="pip pos-7"></div>
      <div class="pip pos-8"></div>
      <div class="pip pos-9"></div>
    </div>

    <button id="roll" type="button">Roll 🎲</button>
    <div class="note">Built for Lab 8 using jQuery.</div>
  </div>

  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Your script -->
  <script>
    // Utility: returns an integer in [min, max], inclusive.
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // On DOM ready (jQuery)
    $(function () {
      const $dice = $('#dice');
      const faces = ['show-1', 'show-2', 'show-3', 'show-4', 'show-5', 'show-6'];

      $('#roll').on('click', function () {
        // 1) start the shake animation
        $dice.addClass('rolling');

        // 2) when the animation is "done", pick a new value and show it
        //    (700ms matches the CSS keyframes duration)
        setTimeout(() => {
          const next = randInt(1, 6);

          // remove any existing show-* class, then add the new one
          $dice.removeClass(faces.join(' ')).addClass('show-' + next);

          // 3) stop shaking
          $dice.removeClass('rolling');
        }, 700);
      });
    });
  </script>
</body>
</html>
